[package]
name = "tether"
version = "0.1.0"
description = "Tether — a local-first HTTP workbench"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tether_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tokio = { version = "1.54.0", features = ["time", "sync", "macros"] }
tokio-util = "0.7.20"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "brotli"] }
keyring = { version = "3", features = ["apple-native"] }
tauri-plugin-dialog = "2"
base64 = "0.23.1"
